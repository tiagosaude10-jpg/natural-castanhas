<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24552a">
<title>Corrigindo Natural Castanhas</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;background:#f3f7f2;color:#1e241f;text-align:center}.box{max-width:420px;background:#fff;border-radius:24px;padding:30px 22px;box-shadow:0 15px 45px rgba(35,72,41,.15)}h1{font-size:24px;margin:0 0 12px;color:#24552a}p{line-height:1.5;color:#667067}.loader{width:46px;height:46px;border:5px solid #dfe8df;border-top-color:#24552a;border-radius:50%;margin:0 auto 20px;animation:girar .8s linear infinite}.ok{font-size:48px;margin-bottom:12px}@keyframes girar{to{transform:rotate(360deg)}}button{border:0;border-radius:14px;background:#24552a;color:#fff;padding:15px 20px;font-size:16px;font-weight:800;width:100%;display:none}
</style>
</head>
<body>
<div class="box"><div id="icon" class="loader"></div><h1 id="title">Corrigindo o Núcleo 3</h1><p id="message">Aguarde alguns segundos. Estamos removendo a versão antiga armazenada no aparelho.</p><button id="openButton">Abrir Natural Castanhas</button></div>
<script>
(async function(){
 const icon=document.getElementById('icon'),title=document.getElementById('title'),message=document.getElementById('message'),button=document.getElementById('openButton');
 const finish=function(){icon.className='ok';icon.textContent='✓';title.textContent='Correção concluída';message.textContent='O acesso ao Núcleo 3 foi atualizado. O aplicativo será aberto agora.';button.style.display='block';button.onclick=function(){location.replace('./index.html?versao=4&t='+Date.now())};setTimeout(button.onclick,1200)};
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(function(reg){return reg.unregister()}));
   }
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(function(key){return caches.delete(key)}));
   }
   if('serviceWorker' in navigator){
     await navigator.serviceWorker.register('./service-worker.js?v=4',{scope:'./'});
     await navigator.serviceWorker.ready;
   }
   finish();
 }catch(error){
   icon.className='ok';icon.textContent='!';title.textContent='Não foi possível concluir';message.textContent='Toque no botão abaixo para abrir o Núcleo 3 diretamente.';button.style.display='block';button.textContent='Abrir Núcleo 3';button.onclick=function(){location.href='./module3.html?t='+Date.now()};
 }
})();
</script>
</body>
</html>
